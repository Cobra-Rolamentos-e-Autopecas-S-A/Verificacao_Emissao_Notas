name: Atualizar README

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Faz checkout do repositório
      - uses: actions/checkout@v3

      # 2️⃣ Atualiza o documentacao.md
      - name: Atualizar documentacao.md
        run: |
          # Atualiza o arquivo com a data
          echo "Última atualização: $(date)" > docs/documentatio/documentacao.md
          
          # Configura o Git para o commit
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Adiciona mudanças
          git add docs/documentatio/documentacao.md
          
          # Commit apenas se houver mudanças
          git diff --cached --quiet || git commit -m "Atualiza documentacao.md automaticamente"
          
          # Push para o branch main
          git push
