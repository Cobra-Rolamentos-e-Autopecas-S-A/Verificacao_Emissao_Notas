name: Gerar documentação automática

on:
  push:
    branches: [ "v1.0" ]
    paths:
      - 'verifica.js'

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar documentação
        run: npm run generate-docs

      - name: Commitar e push docs geradas (se houver mudanças)
        run: |
          git add docs/documentacao_auto/documentacao_auto.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git commit -m "Atualiza documentação automática (verifica.js)"
            git push
          else
            echo "Nenhuma mudança na documentação gerada."
          fi
